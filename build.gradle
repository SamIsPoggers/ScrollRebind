plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.bishopsexe.scrollrebind'

base {
    archivesName = 'scrollrebind-forge-1.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'scrollrebind'
            mods {
                scrollrebind {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'scrollrebind.refmap.json'
    config 'scrollrebind.mixins.json'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'scrollrebind',
            'Specification-Vendor'    : 'bishopsexe',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'bishopsexe',
            'MixinConfigs'            : 'scrollrebind.mixins.json'
        ])
    }
}
